<style>
.hl{
  --hl-bg:#ffffff; --hl-surface:#faf9f8; --hl-border:#e1dfdd; --hl-text:#201f1e; --hl-muted:#605e5c;
  --hl-accent:#0f6cbd; --hl-accent-soft:#eff6fc; --hl-today:#fff4ce; --hl-radius:8px;

.hl *{box-sizing:border-box}
.hl button,.hl select{font:inherit;color:inherit}
.hl-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hl-title{margin:0;font-size:18px;font-weight:600}
.hl-sub{color:var(--hl-muted);font-size:12px;margin-top:2px}
.hl-seg{display:inline-flex;border:1px solid var(--hl-border);border-radius:6px;overflow:hidden}
.hl-seg button{border:0;background:#fff;padding:6px 14px;cursor:pointer}
.hl-seg button+button{border-left:1px solid var(--hl-border)}
.hl-seg button[aria-pressed="true"]{background:var(--hl-accent);color:#fff}
.hl-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.hl-btn{border:1px solid var(--hl-border);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;min-height:32px}
.hl-btn:hover:not(:disabled){background:var(--hl-surface)}
.hl-btn:disabled{opacity:.4;cursor:default}
.hl-select{border:1px solid var(--hl-border);background:#fff;border-radius:6px;padding:6px 10px;min-height:32px;text-transform:capitalize}
.hl button:focus-visible,.hl select:focus-visible{outline:2px solid var(--hl-accent);outline-offset:1px}
.hl-weeks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.hl-wk{border:1px solid var(--hl-border);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.hl-wk:hover{background:var(--hl-surface)}
.hl-wk[aria-pressed="true"]{border-color:var(--hl-accent);background:var(--hl-accent-soft);color:var(--hl-accent);font-weight:600}
.hl-wk small{background:var(--hl-border);color:var(--hl-text);border-radius:999px;padding:0 7px;font-size:11px;font-weight:600}
.hl-wk[aria-pressed="true"] small{background:var(--hl-accent);color:#fff}
.hl-filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 0;border-top:1px solid var(--hl-border);border-bottom:1px solid var(--hl-border);margin-bottom:12px}
.hl-filters .lbl{font-size:12px;color:var(--hl-muted);margin-right:4px}
.hl-chip{border:1px solid var(--hl-border);background:#fff;border-radius:999px;padding:3px 11px 3px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.hl-chip i{width:10px;height:10px;border-radius:50%;background:var(--k);display:inline-block}
.hl-chip[aria-pressed="true"]{border-color:var(--k);background:color-mix(in srgb,var(--k) 14%,#fff);font-weight:600}
.hl-clear{border:0;background:none;color:var(--hl-accent);cursor:pointer;padding:4px 6px;font-size:13px}
.hl-range{margin:0 0 8px;font-size:15px;font-weight:600}
.hl-banner{background:var(--hl-accent-soft);border:1px solid #c7e0f4;border-radius:6px;padding:8px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.hl-grid{display:grid;gap:10px;grid-template-columns:1fr}
@container (min-width:600px){.hl-grid{grid-template-columns:repeat(4,1fr)}}
@container (min-width:960px){.hl-grid{grid-template-columns:repeat(7,1fr)}}
.hl-day{border:1px solid var(--hl-border);border-radius:var(--hl-radius);background:#fff;display:flex;flex-direction:column;min-height:110px}
.hl-day.is-weekend{background:var(--hl-surface)}
.hl-day.is-today{border-color:#c19c00;box-shadow:0 0 0 1px #c19c00}
.hl-day header{display:flex;align-items:baseline;gap:6px;padding:8px 10px;border-bottom:1px solid var(--hl-border)}
.hl-day.is-today header{background:var(--hl-today)}
.hl-dow{font-size:12px;color:var(--hl-muted);text-transform:uppercase;letter-spacing:.03em}
.hl-dnum{font-size:20px;font-weight:600;line-height:1}
.hl-dmon{font-size:12px;color:var(--hl-muted)}
.hl-hoy{margin-left:auto;font-size:11px;background:#c19c00;color:#fff;border-radius:4px;padding:1px 6px}
.hl-body{padding:8px 10px;display:flex;flex-direction:column;gap:8px;flex:1}
.hl-none{color:#a19f9d;font-size:12px}
.hl-item{border-left:3px solid var(--k);padding-left:8px}
.hl-codes{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:3px}
.hl-code{font-size:11px;font-weight:700;background:color-mix(in srgb,var(--k) 16%,#fff);border:1px solid var(--k);border-radius:4px;padding:0 5px;line-height:18px}
.hl-name{font-size:13px;font-weight:600}
.hl-note{font-size:12px;color:var(--hl-muted);margin-top:1px}
.hl-also{font-size:12px;color:var(--hl-muted);border-top:1px dashed var(--hl-border);padding-top:6px;margin-top:auto}
.hl-also b{color:var(--hl-text)}
.hl-more{border-top:1px solid var(--hl-border);padding:6px 10px;font-size:12px;color:var(--hl-muted)}
.hl-more summary{cursor:pointer;color:var(--hl-accent)}
.hl-more dl{margin:6px 0 0}
.hl-more dt{font-weight:600;color:var(--hl-text);margin-top:4px}
.hl-more dd{margin:0}
.hl-mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hl-mh{font-size:12px;color:var(--hl-muted);text-align:center;padding:4px 0;text-transform:uppercase}
.hl-cell{border:1px solid var(--hl-border);border-radius:6px;background:#fff;min-height:84px;padding:4px 5px;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.hl-cell:hover{border-color:var(--hl-accent)}
.hl-cell.out{background:var(--hl-surface);opacity:.55}
.hl-cell.is-today{border-color:#c19c00;box-shadow:0 0 0 1px #c19c00;background:var(--hl-today)}
.hl-cell .n{font-size:13px;font-weight:600}
.hl-cell .tags{display:flex;flex-wrap:wrap;gap:2px}
.hl-tag{font-size:10px;font-weight:700;line-height:15px;padding:0 4px;border-radius:3px;border:1px solid var(--k);background:color-mix(in srgb,var(--k) 16%,#fff)}
@container (max-width:560px){
  .hl-cell{min-height:56px}
  .hl-tag{font-size:0;width:9px;height:9px;padding:0;border-radius:50%;background:var(--k);border:0}
}
.hl-foot{margin-top:12px;font-size:11px;color:var(--hl-muted)}
</style>

      dl.appendChild(h("dt", "", "Tipo"));
      dl.appendChild(h("dd", "", rec.tipo));
      items.forEach(function (it) {
        var src = it.src || rec.src;
        if (!src) return;
        dl.appendChild(h("dt", "", "Fuente · " + it.c));
        dl.appendChild(h("dd", "", src));
      });
      det.appendChild(dl);
      card.appendChild(det);
    }
    return card;
  }

  function weekView() {
    var frag = document.createDocumentFragment();
    var end = addDays(state.week, 6);
    var cnt = countRange(state.week, end);
    var title = "Semana del " + state.week.getDate() + (state.week.getMonth() !== end.getMonth() ? " " + MESES[state.week.getMonth()] : "") +
      " al " + end.getDate() + " de " + MESES[end.getMonth()] + " de " + end.getFullYear();
    frag.appendChild(h("h3", "hl-range", title));

    if (!cnt) {
      var nx = nextAfter(end), b = h("div", "hl-banner");
      b.appendChild(h("span", "", "Sin festivos esta semana" + (selCount() ? " en los países seleccionados" : "") + "." +
        (nx ? " Siguiente: " + fmtLong(nx) + "." : "")));
      if (nx) b.appendChild(btn("Ir a esa semana", "hl-btn", function () { goDay(nx); }));
      frag.appendChild(b);
    }
    var grid = h("div", "hl-grid");
    for (var i = 0; i < 7; i++) grid.appendChild(dayCard(addDays(state.week, i), i));
    frag.appendChild(grid);
    return frag;
  }

  /* ---------- vista mes ---------- */
  function monthView() {
    var frag = document.createDocumentFragment();
    var first = mDate(state.month);
    var last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
    var cnt = countRange(first, last);
    frag.appendChild(h("h3", "hl-range", MESES[first.getMonth()].charAt(0).toUpperCase() + MESES[first.getMonth()].slice(1) + " " + first.getFullYear() +
      " · " + cnt + (cnt === 1 ? " festivo" : " festivos")));
    var grid = h("div", "hl-mgrid");
    DIAS.forEach(function (n) { grid.appendChild(h("div", "hl-mh", n)); });
    for (var d = mondayOf(first); d <= last || ((d.getDay() + 6) % 7) !== 0; d = addDays(d, 1)) {
      (function (day) {
        var k = key(day), items = itemsOn(k);
        var c = btn("", "hl-cell" + (day.getMonth() !== first.getMonth() ? " out" : "") + (k === todayKey ? " is-today" : ""),
          function () { goDay(day); });
        c.setAttribute("aria-label", fmtLong(day) + (items.length ? ": " + items.map(function (i) { return i.c + " – " + i.n; }).join("; ") : ""));
        c.appendChild(h("span", "n", String(day.getDate())));
        if (items.length) {
          var tags = h("span", "tags");
          items.forEach(function (it) {
            var t = h("span", "hl-tag", pais[it.c].c); colorVar(t, it.c); t.title = it.c + ": " + it.n; tags.appendChild(t);
          });
          c.appendChild(tags);
        }
        grid.appendChild(c);
      })(d);
    }
    frag.appendChild(grid);
    return frag;
  }

  function render() {
    root.replaceChildren();
    root.appendChild(header());
    root.appendChild(nav());
    if (state.view === "week") root.appendChild(weekChips());
    root.appendChild(filters());
    root.appendChild(state.view === "week" ? weekView() : monthView());
    root.appendChild(h("div", "hl-foot", "Fuente: Excel «Festivos LATAM 2026–2027». Clic en un día del mes para abrir su semana."));
  }
  render();
})();
</script>

</body></html>
